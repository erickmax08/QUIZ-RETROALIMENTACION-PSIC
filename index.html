<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz de Retroalimentación</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#f7efe5,#f5d9d0);
    min-height:100vh;
    color:#263238;
}

.container{
    width:92%;
    max-width:1100px;
    margin:30px auto;
    background:white;
    border:4px solid #182b49;
    border-radius:24px;
    padding:30px;
    box-shadow:0 8px 25px rgba(0,0,0,.15);
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.header h1{
    margin:5px 0;
    color:#182b49;
    font-size:36px;
}

.header p{
    margin:5px 0;
    color:#666;
    font-size:17px;
}

.search-box{
    width:100%;
    padding:14px 18px;
    border:2px solid #ddd;
    border-radius:15px;
    font-size:16px;
    margin-bottom:25px;
    outline:none;
}

.search-box:focus{
    border-color:#182b49;
}

.info{
    text-align:center;
    margin-bottom:20px;
    font-weight:bold;
    color:#555;
}

.quiz-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:20px;
}

.quiz-card{
    background:linear-gradient(145deg,#fff,#f5f7fa);
    border:2px solid #d9dee7;
    border-radius:20px;
    padding:25px;
    text-align:center;
    transition:.25s;
    box-shadow:0 5px 12px rgba(0,0,0,.08);
}

.quiz-card:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 20px rgba(0,0,0,.15);
    border-color:#182b49;
}

.quiz-icon{
    font-size:50px;
    margin-bottom:10px;
}

.quiz-card h2{
    color:#182b49;
    font-size:21px;
    margin:10px 0;
}

.quiz-grade{
    display:inline-block;
    background:#182b49;
    color:white;
    padding:7px 14px;
    border-radius:20px;
    font-size:14px;
    margin-bottom:18px;
}

.quiz-button{
    display:inline-block;
    text-decoration:none;
    background:#182b49;
    color:white;
    padding:12px 25px;
    border-radius:12px;
    font-weight:bold;
    transition:.2s;
}

.quiz-button:hover{
    background:#29466f;
    transform:scale(1.03);
}

.loading{
    text-align:center;
    padding:40px;
    font-size:18px;
    color:#666;
}

.error{
    text-align:center;
    padding:30px;
    color:#a33;
    background:#fff0f0;
    border-radius:15px;
}

.no-results{
    text-align:center;
    padding:30px;
    color:#666;
}

.footer{
    text-align:center;
    margin-top:35px;
    padding-top:20px;
    border-top:1px solid #ddd;
    color:#666;
    font-size:14px;
}

@media(max-width:600px){
    .container{
        width:95%;
        padding:20px;
        margin:15px auto;
    }

    .header h1{
        font-size:28px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🧠 Quiz de Retroalimentación</h1>
        <p>I.E. N° 84165 "ASTERIA CASTRO PAREJA"</p>
        <p>Área de Psicología / Tutoría</p>
    </div>

    <input
        type="text"
        id="search"
        class="search-box"
        placeholder="🔎 Buscar un quiz..."
        oninput="filtrarQuizzes()"
    >

    <div class="info">
        <span id="cantidad">Buscando quizzes...</span>
    </div>

    <div id="quizGrid" class="quiz-grid">
        <div class="loading">
            ⏳ Buscando quizzes...
        </div>
    </div>

    <div class="footer">
        I.E. N° 84165 "Asteria Castro Pareja"<br>
        Área de Psicología / Tutoría
    </div>

</div>

<script>

const USUARIO = "erickmax08";
const REPOSITORIO = "QUIZ-RETROALIMENTACION-PSIC";

let quizzes = [];

/*
    ARCHIVOS QUE NO DEBEN APARECER COMO QUIZ
*/
const archivosExcluidos = [
    "index.html",
    "quiz_impresion_arreglada.html"
];


/*
    BUSCAR AUTOMÁTICAMENTE LOS ARCHIVOS HTML
*/
async function cargarQuizzes(){

    const grid = document.getElementById("quizGrid");
    const cantidad = document.getElementById("cantidad");

    try{

        const url =
        `https://api.github.com/repos/${USUARIO}/${REPOSITORIO}/contents/`;

        const respuesta = await fetch(url);

        if(!respuesta.ok){
            throw new Error("No se pudo acceder al repositorio.");
        }

        const archivos = await respuesta.json();

        const archivosHTML = archivos.filter(archivo => {

            return archivo.type === "file"
                && archivo.name.toLowerCase().endsWith(".html")
                && !archivosExcluidos.includes(
                    archivo.name.toLowerCase()
                );

        });

        if(archivosHTML.length === 0){

            grid.innerHTML = `
                <div class="no-results">
                    <h3>📭 No hay quizzes disponibles</h3>
                    <p>Sube un archivo HTML al repositorio.</p>
                </div>
            `;

            cantidad.textContent = "0 quizzes disponibles";
            return;
        }

        /*
            LEER INFORMACIÓN DE CADA QUIZ
        */

        quizzes = await Promise.all(

            archivosHTML.map(async archivo => {

                let titulo = limpiarNombre(archivo.name);
                let grado = "Quiz de Psicología";
                let icono = "🧠";

                try{

                    const htmlURL =
                    `https://raw.githubusercontent.com/${USUARIO}/${REPOSITORIO}/main/${encodeURIComponent(archivo.name)}`;

                    const htmlRespuesta =
                    await fetch(htmlURL);

                    if(htmlRespuesta.ok){

                        const texto =
                        await htmlRespuesta.text();

                        /*
                            BUSCAR METADATOS SI EXISTEN
                        */

                        const tituloMeta =
                        texto.match(
                            /<meta[^>]+name=["']quiz-title["'][^>]+content=["']([^"']+)["']/i
                        );

                        const gradoMeta =
                        texto.match(
                            /<meta[^>]+name=["']quiz-grade["'][^>]+content=["']([^"']+)["']/i
                        );

                        const iconoMeta =
                        texto.match(
                            /<meta[^>]+name=["']quiz-icon["'][^>]+content=["']([^"']+)["']/i
                        );

                        if(tituloMeta){
                            titulo = tituloMeta[1];
                        }

                        if(gradoMeta){
                            grado = gradoMeta[1];
                        }

                        if(iconoMeta){
                            icono = iconoMeta[1];
                        }

                    }

                }catch(error){

                    console.log(
                        "No se pudieron leer los metadatos:",
                        archivo.name
                    );

                }

                return {
                    nombreArchivo: archivo.name,
                    titulo: titulo,
                    grado: grado,
                    icono: icono,
                    url: archivo.name
                };

            })

        );

        mostrarQuizzes(quizzes);

    }catch(error){

        console.error(error);

        grid.innerHTML = `
            <div class="error">
                <h3>⚠️ No se pudieron cargar los quizzes</h3>
                <p>Actualiza la página e inténtalo nuevamente.</p>
            </div>
        `;

        cantidad.textContent = "Error al cargar";

    }

}


/*
    MOSTRAR LAS TARJETAS
*/

function mostrarQuizzes(lista){

    const grid = document.getElementById("quizGrid");
    const cantidad = document.getElementById("cantidad");

    cantidad.textContent =
        `${lista.length} ${lista.length === 1 ? "quiz disponible" : "quizzes disponibles"}`;

    if(lista.length === 0){

        grid.innerHTML = `
            <div class="no-results">
                <h3>🔎 No se encontraron resultados</h3>
            </div>
        `;

        return;
    }

    grid.innerHTML = lista.map(quiz => `

        <div class="quiz-card">

            <div class="quiz-icon">
                ${quiz.icono}
            </div>

            <h2>
                ${quiz.titulo}
            </h2>

            <div class="quiz-grade">
                ${quiz.grado}
            </div>

            <br>

            <a
                class="quiz-button"
                href="${encodeURI(quiz.url)}"
            >
                ▶ COMENZAR QUIZ
            </a>

        </div>

    `).join("");

}


/*
    BUSCADOR
*/

function filtrarQuizzes(){

    const texto =
        document.getElementById("search")
        .value
        .toLowerCase()
        .trim();

    const filtrados =
        quizzes.filter(quiz => {

            return (
                quiz.titulo.toLowerCase().includes(texto)
                ||
                quiz.grado.toLowerCase().includes(texto)
                ||
                quiz.nombreArchivo.toLowerCase().includes(texto)
            );

        });

    mostrarQuizzes(filtrados);

}


/*
    CONVERTIR EL NOMBRE DEL ARCHIVO EN UN TÍTULO
    SI EL QUIZ NO TIENE METADATOS
*/

function limpiarNombre(nombre){

    return nombre
        .replace(/\.html$/i,"")
        .replace(/[_-]+/g," ")
        .replace(/\s+/g," ")
        .trim();

}


/*
    INICIAR
*/

cargarQuizzes();

</script>

</body>
</html>
